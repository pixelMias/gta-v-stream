# Tests on every push and pull request; on main, deploy to the test server when the secrets exist:
#   DEPLOY_HOST          IPv4 address of the server
#   DEPLOY_SSH_KEY       private deploy key (ed25519), its public part is in /home/deploy/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS   host key line printed at the end of deploy/cloud/bootstrap.sh
name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: dotnet test
        run: dotnet test GtaStream.sln -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: extension build
        working-directory: extension
        run: npm ci && npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: secrets present?
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "Kein Secret DEPLOY_HOST – Deploy uebersprungen."; echo "go=false" >> "$GITHUB_OUTPUT";
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.go == 'true'
      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.go == 'true'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.go == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: build release
        if: steps.check.outputs.go == 'true'
        run: |
          # Framework-dependent: runs on x86_64 and arm64 servers with the ASP.NET Core 8 runtime.
          dotnet publish backend/GtaStream.Ebs -c Release -o out/server -p:UseAppHost=false
          echo "$GITHUB_SHA" > out/server/commit.txt
          (cd extension && npm ci && npm run build)
          cp -r extension/dist out/web
          tar -czf "$GITHUB_SHA.tar.gz" -C out .
      - name: upload and activate
        if: steps.check.outputs.go == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -q "$GITHUB_SHA.tar.gz" "deploy@$DEPLOY_HOST:/opt/gtastream/incoming/"
          ssh "deploy@$DEPLOY_HOST" /opt/gtastream/bin/activate "$GITHUB_SHA"
